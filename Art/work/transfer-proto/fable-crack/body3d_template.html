<script>
const DATA=globalThis.__DATA__;

}else{
const NOTES={

 shade:"relief + ombres + jambes: shading read as a zenithal light, outline = rim of the body, nipples raised, navel hollowed, sex = dome in the groin creases, legs split below the crotch: the drawn notch when present, otherwise an internal medial seam from the crotch landmark. Skeleton = schematic, fitted on the landmark rows (not anatomical bone shapes). Organs = a first volume from a profile reference (shaft hanging forward and down from the pubis, scrotum below and behind), proportioned on the shoulder width.",

 simple:"simple volume: superellipse sections from the E masks."};

// WDI look: toon top light from the view-space normal, crease/areola maps projected from the three sprite frames, rim.
const Q=new URLSearchParams(location.search);
const wdiMat=new THREE.ShaderMaterial({side:THREE.DoubleSide,extensions:{derivatives:true},
 uniforms:{tS:{value:null},tN:{value:null},tE:{value:null},gS:{value:null},gN:{value:null},gE:{value:null},bS:{value:null},bN:{value:null},bE:{value:null},rows:{value:new THREE.Vector4()},erow:{value:new THREE.Vector2()},off:{value:new THREE.Vector3()},pxw:{value:13},opacity:{value:1},zen:{value:1},cdir:{value:new THREE.Vector3(0,0,1)},fl:{value:+(Q.get('form')||.85)},lc:{value:+(Q.get('cap')||.6)},gm:{value:+(Q.get('gm')||.6)}},

 fragmentShader:`uniform float opacity;uniform float zen;varying vec3 vNo;

// constant-width black outline: screen-space pass on the body mask (the sprite outline is a fixed width inside the silhouette)
const RT=new THREE.WebGLMultisampleRenderTarget(2,2,{format:THREE.RGBAFormat});
const post=new THREE.Scene(),pcam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

 vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tD;uniform vec2 px;uniform float r;uniform float on;varying vec2 u;

  e=max(e,1.-texture2D(tD,u+d*px*r).a);e=max(e,1.-texture2D(tD,u+d*px*r*.66).a);e=max(e,1.-texture2D(tD,u+d*px*r*.33).a);}

// WDI is a source image, unlike the projection maps above: keep its conventional top-to-bottom orientation on a plane.
const refTexOf=u=>{const t=new THREE.TextureLoader().load(u);t.flipY=true;t.generateMipmaps=false;t.minFilter=t.magFilter=THREE.LinearFilter;return t};
let cur=skin,outlinePx=4;
const bone=new THREE.MeshStandardMaterial({color:0xe9e4d4,roughness:.6});
const boneL=new THREE.MeshStandardMaterial({color:0xe9e4d4,roughness:.6,side:THREE.DoubleSide});
const fatL=new THREE.MeshStandardMaterial({color:0xd0a64c,roughness:.85,transparent:true,opacity:.78,side:THREE.DoubleSide});
const ghostL=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,side:THREE.DoubleSide});
// a layer of the stack model (right half): its mesh and the mirror image
function layerMesh(L,mat){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(L.v,3));g.setIndex(L.i);g.computeVertexNormals();
  const grp=new THREE.Group(),a=new THREE.Mesh(g,mat),b=new THREE.Mesh(g,mat);b.scale.x=-1;grp.add(a);grp.add(b);return grp}
const flesh=new THREE.MeshStandardMaterial({color:0xc48a76,roughness:.75});
// ring-to-ring noise of the mesh normals sits at the toon threshold and bands the greys: low-pass the normals on the grid (rows more than ring)
function smoothNormals(g,R,A,sn){const n=g.attributes.normal.array,m=R*A,t=new Float32Array(m*3);
  const pass=(rowDir)=>{for(let i=0;i<R;i++)for(let k=0;k<A;k++){let a,b;
    if(rowDir){a=Math.max(0,i-1)*A+k;b=Math.min(R-1,i+1)*A+k}else{a=i*A+(k+A-1)%A;b=i*A+(k+1)%A}
    const c=i*A+k;for(let j=0;j<3;j++)t[c*3+j]=.5*n[c*3+j]+.25*n[a*3+j]+.25*n[b*3+j]}
    for(let c=0;c<m;c++){const x=t[c*3],y=t[c*3+1],z=t[c*3+2],l=Math.hypot(x,y,z)||1;n[c*3]=x/l;n[c*3+1]=y/l;n[c*3+2]=z/l}};
  const ns=Q.get('sn')!=null?+Q.get('sn'):(sn??60);
  for(let s=0;s<ns;s++)pass(true);pass(false);if(ns>2)pass(false);g.attributes.normal.needsUpdate=true}
function meshOf(rows,A,{capTop=false,capBottom=false,tilt=null,sn=null}={}){
  const R=rows.length,pos=[],idx=[];
  for(let i=0;i<R;i++)for(let k=0;k<A;k++){const j=k*3;pos.push(rows[i][j],rows[i][j+1],rows[i][j+2])}
  for(let i=0;i<R-1;i++)for(let k=0;k<A;k++){const a=i*A+k,b=i*A+(k+1)%A,c=(i+1)*A+k,d=(i+1)*A+(k+1)%A;idx.push(a,c,b,b,c,d)}
  function cap(row,reverse){
    const center=[0,0,0];
    for(let k=0;k<A;k++){const j=k*3;center[0]+=row[j];center[1]+=row[j+1];center[2]+=row[j+2]}
    const c=pos.length/3;pos.push(center[0]/A,center[1]/A,center[2]/A);
    const base=reverse?(R-1)*A:0;
    for(let k=0;k<A;k++){const a=base+k,b=base+(k+1)%A;idx.push(reverse?c:a,reverse?a:c,reverse?b:b)}
  }

}
function tube(pts,r,mat,seg){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));return new THREE.Mesh(new THREE.TubeGeometry(c,seg||24,r,6,false),mat||bone)}

function setReferenceBox(){
  if(!refBox)return;const q=refBox,e=q.e,F=e.frame,b=q.b,c=q.c,show=$('ref').checked,o=+$('ro').value/100;
  // Four real faces surround the body.  Only the camera-facing one is drawn, preventing the opposite translucent
  // drawing from bleeding through the skin while retaining a correctly placed WDI image on every cardinal face.
  const put=(key,s,rot,pos)=>{const qf=q.faces[key];qf.p.rotation.set(...rot);qf.p.scale.set(...s);qf.p.position.set(...pos);qf.m.opacity=o;qf.m.needsUpdate=true;};
  let z=b.max.z+.5,zw=z+G.position.z,s=(fitD-zw)/fitD;
  put('s',[s,s,1],[0,0,0],[c.x+s*(256-F.cxs-c.x),c.y+s*(-256-c.y),z]);
  z=b.min.z-.5;zw=z+G.position.z;s=(fitD+zw)/fitD;
  put('n',[-s,s,1],[0,0,0],[c.x+s*(F.cxn-256-c.x),c.y+s*(-256-c.y),z]);
  let x=b.min.x-.5,xw=x+G.position.x;s=(fitD+xw)/fitD;
  put('e',[s,s,1],[0,-Math.PI/2,0],[x,c.y+s*(-256-c.y),c.z+s*(256-F.zmean-c.z)]);
  x=b.max.x+.5;xw=x+G.position.x;s=(fitD-xw)/fitD;
  put('w',[s,s,1],[0,Math.PI/2,0],[x,c.y+s*(-256-c.y),c.z+s*(F.zmean-256-c.z)]);
  const dx=cam.position.x-ctl.target.x,dz=cam.position.z-ctl.target.z;
  const face=Math.abs(dz)>=Math.abs(dx)?(dz>=0?'s':'n'):(dx<0?'e':'w');

function addReferenceOverlay(e,b,c){
  if(!e.wdi||!e.frame)return;
  const maps={s:refTexOf(e.wdi.s),n:refTexOf(e.wdi.n),e:refTexOf(e.wdi.e)};
  const face=(map)=>{const m=new THREE.MeshBasicMaterial({map,transparent:true,opacity:+$('ro').value/100,depthTest:true,depthWrite:false,side:THREE.DoubleSide});const p=new THREE.Mesh(new THREE.PlaneGeometry(512,512),m);p.renderOrder=20;p.userData.k='ref';G.add(p);return{p,m}};

function skeleton(rows,A,lm,legs,cage){
  const g=new THREE.Group(),R=rows.length;

  // every bone is placed from the SKIN: a ray from the axis of the row, the skin hit, then a margin under it (px at 512)
  const info=i=>{let xa=1e9,xb=-1e9,za=1e9,zb=-1e9;for(let k=0;k<A;k++){const x=rows[i][k*3],z=rows[i][k*3+2];xa=Math.min(xa,x);xb=Math.max(xb,x);za=Math.min(za,z);zb=Math.max(zb,z)}return{cx:(xa+xb)/2,cz:(za+zb)/2,hw:(xb-xa)/2,zb,za}};
  const rad=(i,ang)=>{const f=info(i),dx=Math.sin(ang),dz=Math.cos(ang);let best=1e9;
    for(let k=0;k<A;k++){const k2=(k+1)%A,px=rows[i][k*3]-f.cx,pz=rows[i][k*3+2]-f.cz,qx=rows[i][k2*3]-f.cx,qz=rows[i][k2*3+2]-f.cz;
      const ex=qx-px,ez=qz-pz,den=dx*ez-dz*ex;if(Math.abs(den)<1e-9)continue;

  for(let i=0;i<NS;i++){const t=i/(NS-1),y=ys+(ye-ys)*t,q=zspan(y),p=[q.f.cx,y,q.zb+Math.max(14,0.30*(q.zf-q.zb))];spine.push(p);
    g.add(ball(p,4.4+3.2*t,2.6,4.4+3.2*t))}

  // from the collarbone down to the costal margin (about 85 % of the way from the nipples to the navel: the lowest rib edge sits just above the navel)
  const apexW=lm.apex??fold,yRibT2=top-0.20*(top-fold),yRibB2=apexW-0.85*(apexW-navel),NR=12;
  const wfun=t=>t<=0.65?0.45+0.55*Math.sin(t/0.65*Math.PI/2):1-0.12*((t-0.65)/0.35);

      lev.push({t,y,f,ax:rad(i,Math.PI/2)-10,zf:f.cz+rad(i,0)-7,zb:f.cz-rad(i,Math.PI)+12,wf:wfun(t),df:dfun(t)})}
    const sm=(key)=>{const v=lev.map(L=>L[key]);return v.map((_,k)=>{let s=0,n=0;for(let j=-2;j<=2;j++){const kk=Math.max(0,Math.min(NR-1,k+j));s+=v[kk];n++}return s/n})};

    {const n=NR,mt=(n-1)/2;let sxy=0,sxx=0,my=0;zfS.forEach(v=>my+=v/n);zfS.forEach((v,k)=>{sxy+=(k-mt)*(v-my);sxx+=(k-mt)*(k-mt)});const sl=sxy/sxx;
     const res=zfS.map((v,k)=>v-(my+sl*(k-mt))),sr=[...res].sort((p,q)=>p-q),sh0=sr[Math.floor(0.6*(n-1))];

    const qs=(arr,p)=>{const v=[...arr].sort((a,b)=>a-b);return v[Math.floor(p*(v.length-1))]};
