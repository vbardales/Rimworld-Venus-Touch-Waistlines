// Map an existing muscle-library vertex back to the front or back skin at its

function ringDepth(row,A,x,side){
  const hits=[];
  for(let k=0;k<A;k++){
    const a=k*3,b=((k+1)%A)*3,x0=row[a],x1=row[b],z0=row[a+2],z1=row[b+2];
