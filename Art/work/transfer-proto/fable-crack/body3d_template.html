 fragmentShader:`uniform vec3 cdir;uniform sampler2D tS;uniform sampler2D tN;uniform sampler2D tE;uniform sampler2D gS;uniform sampler2D gN;uniform sampler2D gE;uniform sampler2D bS;uniform sampler2D bN;uniform sampler2D bE;uniform vec4 rows;uniform vec2 erow;uniform vec3 off;uniform float pxw;uniform float opacity;uniform float fl;uniform float lc;uniform float gm;

 gt=mix(gt,texture2D(gE,uvE).r,smoothstep(.55,.8,abs(no.x)));gt=mix(gt,1.,gm);

// constant-width black outline: screen-space pass on the body mask (the sprite outline is a fixed width inside the silhouette)
const RT=new THREE.WebGLMultisampleRenderTarget(2,2,{format:THREE.RGBAFormat});
const post=new THREE.Scene(),pcam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const pmat=new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,uniforms:{tD:{value:RT.texture},px:{value:new THREE.Vector2(1,1)},r:{value:10},on:{value:1}},
 vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D tD;uniform vec2 px;uniform float r;uniform float on;varying vec2 u;
void main(){vec4 c=texture2D(tD,u);if(c.a<.01){gl_FragColor=vec4(0.);return;}

 for(int i=0;i<16;i++){float a=float(i)*.3926991;vec2 d=vec2(cos(a),sin(a));
  e=max(e,1.-texture2D(tD,u+d*px*r).a);e=max(e,1.-texture2D(tD,u+d*px*r*.66).a);e=max(e,1.-texture2D(tD,u+d*px*r*.33).a);}

const texOf=u=>{const t=new THREE.TextureLoader().load(u);t.flipY=false;t.generateMipmaps=false;t.minFilter=t.magFilter=THREE.LinearFilter;return t};
let cur=skin,outlinePx=13;
const bone=new THREE.MeshStandardMaterial({color:0xe9e4d4,roughness:.6});
const boneL=new THREE.MeshStandardMaterial({color:0xe9e4d4,roughness:.6,side:THREE.DoubleSide});
const ghostL=new THREE.MeshStandardMaterial({color:0xdde3ea,emissive:0x3c4046,roughness:.95,side:THREE.DoubleSide});
// a layer of the stack model (right half): its mesh and the mirror image
function layerMesh(L,mat){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(L.v,3));g.setIndex(L.i);g.computeVertexNormals();
  const grp=new THREE.Group(),a=new THREE.Mesh(g,mat),b=new THREE.Mesh(g,mat);b.scale.x=-1;grp.add(a);grp.add(b);return grp}
const flesh=new THREE.MeshStandardMaterial({color:0xc48a76,roughness:.75});
// ring-to-ring noise of the mesh normals sits at the toon threshold and bands the greys: low-pass the normals on the grid (rows more than ring)
function smoothNormals(g,R,A,sn){const n=g.attributes.normal.array,m=R*A,t=new Float32Array(m*3);
  const pass=(rowDir)=>{for(let i=0;i<R;i++)for(let k=0;k<A;k++){let a,b;
    if(rowDir){a=Math.max(0,i-1)*A+k;b=Math.min(R-1,i+1)*A+k}else{a=i*A+(k+A-1)%A;b=i*A+(k+1)%A}
    const c=i*A+k;for(let j=0;j<3;j++)t[c*3+j]=.5*n[c*3+j]+.25*n[a*3+j]+.25*n[b*3+j]}
    for(let c=0;c<m;c++){const x=t[c*3],y=t[c*3+1],z=t[c*3+2],l=Math.hypot(x,y,z)||1;n[c*3]=x/l;n[c*3+1]=y/l;n[c*3+2]=z/l}};
  const ns=Q.get('sn')!=null?+Q.get('sn'):(sn??60);
  for(let s=0;s<ns;s++)pass(true);pass(false);if(ns>2)pass(false);g.attributes.normal.needsUpdate=true}

  const R=rows.length,pos=[],idx=[];
  for(let i=0;i<R;i++)for(let k=0;k<A;k++){const j=k*3;pos.push(rows[i][j],rows[i][j+1],rows[i][j+2])}
  for(let i=0;i<R-1;i++)for(let k=0;k<A;k++){const a=i*A+k,b=i*A+(k+1)%A,c=(i+1)*A+k,d=(i+1)*A+(k+1)%A;idx.push(a,c,b,b,c,d)}
  function cap(row,reverse){
    const center=[0,0,0];
    for(let k=0;k<A;k++){const j=k*3;center[0]+=row[j];center[1]+=row[j+1];center[2]+=row[j+2]}
    const c=pos.length/3;pos.push(center[0]/A,center[1]/A,center[2]/A);
    const base=reverse?(R-1)*A:0;
    for(let k=0;k<A;k++){const a=base+k,b=base+(k+1)%A;idx.push(reverse?c:a,reverse?a:c,reverse?b:b)}

  const tl=new Float32Array(pos.length/3);if(tilt)for(let i=0;i<tl.length;i++)tl[i]=tilt(pos[i*3+1]);

function tube(pts,r,mat,seg){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));return new THREE.Mesh(new THREE.TubeGeometry(c,seg||24,r,6,false),mat||bone)}

  const info=i=>{let xa=1e9,xb=-1e9,za=1e9,zb=-1e9;for(let k=0;k<A;k++){const x=rows[i][k*3],z=rows[i][k*3+2];xa=Math.min(xa,x);xb=Math.max(xb,x);za=Math.min(za,z);zb=Math.max(zb,z)}return{cx:(xa+xb)/2,cz:(za+zb)/2,hw:(xb-xa)/2,zb,za}};

      const ex=qx-px,ez=qz-pz,den=dx*ez-dz*ex;if(Math.abs(den)<1e-9)continue;

}
function organs(rows,A,lm){
  const R=rows.length,y0=rows[0][1],y1=rows[R-1][1];

  g.add(ball([cx,sy-0.060*sw,zb-0.055*sw],0.050*sw,0.050*sw,0.040*sw,flesh));

function build(){

  const A=e.A||DATA[mode].A,sn=e.sn??null;

  cur=isWdi(e)?wdiMat:skin;
  if(isWdi(e)){const u=wdiMat.uniforms,F=e.frame;u.tS.value=texOf(e.tex.s);u.tN.value=texOf(e.tex.n);u.tE.value=texOf(e.tex.e);
    u.bS.value=texOf(e.bake.s);u.bN.value=texOf(e.bake.n);u.bE.value=texOf(e.bake.e);
    u.gS.value=texOf(e.gate.s);u.gN.value=texOf(e.gate.n);u.gE.value=texOf(e.gate.e);
    u.rows.value.set(F.s[0],F.s[1],F.n[0],F.n[1]);u.erow.value.set(F.e[0],F.e[1]);u.off.value.set(F.cxs,F.cxn,F.zmean);outlinePx=e.outline||13}

  if(e.layers){const mu=new THREE.Group();e.layers.parts.forEach(p=>mu.add(layerMesh(p,new THREE.MeshStandardMaterial({color:new THREE.Color(p.c[0]/255,p.c[1]/255,p.c[2]/255),roughness:.75,side:THREE.DoubleSide}))));
    mu.userData.k='mu';mu.visible=$('mu').checked;G.add(mu);
    // ghost limbs: what the sprite cuts off (neck, arms, thighs), as skin, bones and muscles of their own
    const gh=e.layers.ghost;if(gh){const add=(o,k)=>{o.userData.k=k;G.add(o)};
      add(layerMesh(gh.skin,ghostL),'ghs');add(layerMesh(gh.bone,boneL),'ghb');
      const gm=new THREE.Group();gh.parts.forEach(p=>gm.add(layerMesh(p,new THREE.MeshStandardMaterial({color:new THREE.Color(p.c[0]/255,p.c[1]/255,p.c[2]/255),roughness:.75,side:THREE.DoubleSide}))));add(gm,'ghm')}}
  const zc=e.frame&&e.frame.zc,tilt=zc?y=>{const r=Math.max(1,Math.min(zc.length-2,Math.round(-y-e.frame.s[0])));return -(zc[r+1]-zc[r-1])/2}:null;
  const torso=meshOf(e.rows,A,{capTop:!e.horns,capBottom:!e.legs,tilt,sn});torso.userData.k='skin';G.add(torso);
  const piece=(rows,o)=>{const m=meshOf(rows,A,{...o,tilt,sn});m.userData.k='skin';G.add(m)};
  if(e.legs){piece(e.legs.L,{capBottom:true});piece(e.legs.R,{capBottom:true})}
  if(e.horns){piece(e.horns.L,{capTop:true});piece(e.horns.R,{capTop:true})}
  if(e.lm){sk.visible=$('sk').checked;sk.userData.k='sk';G.add(sk);
    if(!name.includes('Female')){const og=organs(e.rows,A,e.lm);if(og){og.visible=$('og').checked;og.userData.k='og';G.add(og)}}}
  sc.add(G);
  const bb=new THREE.Box3().setFromObject(torso);const c=new THREE.Vector3();bb.getCenter(c);G.position.sub(c);
  // with the ghost limbs shown the camera steps back and centres on the whole figure; with them off nothing moves
  if(e.layers&&e.layers.ghost&&$('gh').checked){const v=e.layers.ghost.skin.v;for(let i=0;i<v.length;i+=3){bb.expandByPoint(new THREE.Vector3(v[i],v[i+1],v[i+2]));bb.expandByPoint(new THREE.Vector3(-v[i],v[i+1],v[i+2]))}
    const c2=new THREE.Vector3();bb.getCenter(c2);G.position.y-=c2.y-c.y}
  fitD=Math.max(bb.max.y-bb.min.y,(bb.max.x-bb.min.x)*0.8)*1.25/(2*Math.tan(cam.fov*Math.PI/360));fitD=Math.max(fitD,(bb.max.x-bb.min.x)*1.15/(2*Math.tan(cam.fov*Math.PI/360)*cam.aspect));
  apply();$('note').textContent=NOTES[e.layers?'stack':isWdi(e)?'wdi':mode];
}
function apply(){

  G.children.forEach(o=>{if(o.userData.k==='sk')o.visible=sk;if(o.userData.k==='og')o.visible=$('og').checked;if(o.userData.k==='mu')o.visible=mu;if(o.userData.k==='skin')o.visible=!mu;
    if(o.userData.k==='ghs')o.visible=gh&&!mu&&!sk;if(o.userData.k==='ghb')o.visible=gh&&sk;if(o.userData.k==='ghm')o.visible=gh&&mu});
}
function view(v){globalThis.__fit=fitD;const d=fitD;const p=[[0,0,d],[-d,0,0],[0,0,-d]][v];cam.position.set(...p);ctl.target.set(0,0,0);ctl.update()}
sel.onchange=msel.onchange=build;['sk','mu','gh','og','w','op'].forEach(i=>$(i).oninput=apply);
['sk','mu','og'].forEach(i=>{if(Q.get(i))$(i).checked=true});if(Q.get('gh')==='0')$('gh').checked=false;$('gh').addEventListener('change',build);
document.querySelectorAll('button').forEach(b=>b.onclick=()=>view(+b.dataset.v));
build();view(0);sel.addEventListener('change',()=>view(0));msel.addEventListener('change',()=>view(0));
